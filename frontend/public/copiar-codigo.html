<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0E4822" />
    <title>Copiar código · Tutoría UNAS</title>
    <link rel="icon" href="/favicon-64.png" />
    <style>
      /* Página mínima del botón «Copiar código» de los correos: postal de la plantilla, sin cargar el portal. */
      :root {
        --papel: #ffffff;
        --fondo: #ffffff;
        --tinta: #0b2e19;
        --texto: #2f4437;
        --suave: #5b7363;
        --verde: #2b7d3c;
        --verde-osc: #0e5a32;
        --menta: #eaf6ec;
        --dorado: #e9a400;
        --linea: #c3d4c6;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--fondo);
        color: var(--texto);
        font:
          400 16px/1.55 Manrope,
          Aptos,
          'Segoe UI Variable Text',
          'Segoe UI',
          Roboto,
          -apple-system,
          Arial,
          sans-serif;
        display: grid;
        place-items: center;
        padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      }
      main {
        width: 100%;
        max-width: 440px;
        background: var(--papel);
        overflow: hidden;
        text-align: center;
      }
      .franja {
        height: 8px;
        background: repeating-linear-gradient(
          90deg,
          var(--verde) 0 22px,
          var(--papel) 22px 30px,
          var(--dorado) 30px 52px,
          var(--papel) 52px 60px
        );
      }
      .cuerpo {
        padding: 24px 8px 26px;
        display: grid;
        gap: 16px;
        justify-items: center;
      }
      .marca {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 11px;
        text-align: left;
      }
      .marca img {
        width: 38px;
        height: 45px;
        display: block;
      }
      .marca b {
        font-size: 22px;
        font-weight: 800;
        color: var(--verde-osc);
        letter-spacing: -0.01em;
        line-height: 1;
      }
      .marca span {
        display: block;
        font-size: 12px;
        color: var(--suave);
        margin-top: 3px;
      }
      h1 {
        margin: 4px 0 0;
        font-size: 24px;
        line-height: 1.15;
        font-weight: 800;
        color: var(--tinta);
        text-wrap: balance;
      }
      .codigo.clave {
        font-size: 20px;
        letter-spacing: 1px;
        padding: 16px 14px;
        word-break: break-all;
      }
      .codigo {
        font:
          700 40px/1 'JetBrains Mono',
          Consolas,
          Menlo,
          'Courier New',
          monospace;
        letter-spacing: 10px;
        color: var(--verde-osc);
        background: var(--menta);
        border: 2px dashed var(--verde);
        border-radius: 12px;
        padding: 16px 8px 16px 18px;
        text-align: center;
        user-select: all;
        -webkit-user-select: all;
        font-variant-numeric: tabular-nums;
      }
      .estado {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: center;
        min-height: 26px;
        font-weight: 700;
        color: var(--verde-osc);
      }
      .estado span {
        text-align: left;
        max-width: 28ch;
      }
      .estado[data-tipo='aviso'] {
        color: #7a5600;
      }
      .estado svg {
        flex: none;
      }
      button {
        appearance: none;
        cursor: pointer;
        font: inherit;
        font-size: 16px;
        font-weight: 800;
        color: #1d1400;
        background: var(--dorado);
        border: 2px solid var(--tinta);
        border-radius: 8px;
        box-shadow: 3px 3px 0 var(--tinta);
        padding: 13px 22px;
        justify-self: center;
        transition:
          transform 0.08s,
          box-shadow 0.08s;
      }
      button:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 var(--tinta);
      }
      button:focus-visible {
        outline: 3px solid var(--verde);
        outline-offset: 3px;
      }
      p {
        margin: 0;
      }
      .nota {
        font-size: 13.5px;
        color: var(--suave);
        max-width: 34ch;
      }
      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
      }
    </style>
  </head>

        <h1 id="titulo">Tu código</h1>
        <div class="codigo" id="codigo" aria-live="polite">······</div>
        <div class="estado" id="estado" role="status"></div>
        <button type="button" id="copiar">Copiar código</button>
        <p class="nota" id="nota">
          Vuelve a la pestaña de Tutoría UNAS y pégalo en el campo del código. Vence a los 10
          minutos de haberlo pedido.
        </p>

    <script>
      (function () {
        // #482915 → código de verificación; #clave=UNAS-… → contraseña temporal del aviso de acceso.
        var fragmento = (location.hash || '').slice(1);
        var esClave = fragmento.indexOf('clave=') === 0;
        var codigo = esClave
          ? decodeURIComponent(fragmento.slice(6)).trim()
          : fragmento.replace(/\D/g, '');
        var valido = esClave ? /^UNAS-[0-9A-F]{8,64}$/i.test(codigo) : codigo.length === 6;
        var nombre = esClave ? 'contraseña' : 'código';
        // El valor no queda en el historial ni en la barra de direcciones.
        try {
          history.replaceState(null, '', location.pathname);
        } catch (e) {
          /* sin historial */
        }
        var caja = document.getElementById('codigo'),
          estado = document.getElementById('estado'),
          boton = document.getElementById('copiar');
        var ok =
          '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#2b7d3c"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        if (!valido) {
          document.getElementById('titulo').textContent = 'Este enlace no trae un código';
          caja.hidden = true;
          boton.hidden = true;
          document.getElementById('nota').textContent =
            'Abre de nuevo el correo de Tutoría UNAS y usa el botón «Copiar código», o escribe el código a mano.';
          return;
        }
        caja.textContent = codigo;
        if (esClave) {
          document.title = 'Copiar contraseña · Tutoría UNAS';
          document.getElementById('titulo').textContent = 'Tu contraseña temporal';
          caja.classList.add('clave');
          boton.textContent = 'Copiar contraseña';
          document.getElementById('nota').textContent =
            'Vuelve a Tutoría UNAS y pégala en el campo Contraseña. Vence a las 48 horas de creada tu cuenta.';
        }
        function avisar(copiado) {
          if (copiado) {
            estado.removeAttribute('data-tipo');
            estado.innerHTML =
              ok +
              '<span>' +
              (esClave
                ? 'Contraseña copiada. Ya puedes pegarla.'
                : 'Código copiado. Ya puedes pegarlo.') +
              '</span>';
            boton.textContent = 'Copiar otra vez';
          } else {
            estado.setAttribute('data-tipo', 'aviso');
            estado.textContent = esClave
              ? 'Toca «Copiar contraseña» o mantén presionada la contraseña para copiarla.'
              : 'Toca «Copiar código» o mantén presionado el código para copiarlo.';
          }
        }
        function respaldo() {
          var t = document.createElement('textarea');
          t.value = codigo;
          t.setAttribute('readonly', '');
          t.style.position = 'fixed';
          t.style.opacity = '0';
          document.body.appendChild(t);
          t.select();
          var hecho = false;
          try {
            hecho = document.execCommand('copy');
          } catch (e) {
            hecho = false;
          }
          document.body.removeChild(t);
          return hecho;
        }
        function copiar(conGesto) {
          if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(codigo).then(
              function () {
                avisar(true);
              },
              function () {
                avisar(conGesto && respaldo());
              },
            );
          } else {
            avisar(conGesto && respaldo());
          }
        }
        boton.addEventListener('click', function () {
          copiar(true);
        });
        copiar(false); // muchos navegadores permiten copiar al abrir la página; si no, queda el botón
      })();
    </script>
  </body>
