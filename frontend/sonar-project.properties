sonar.projectKey=tutoria-unas-frontend
sonar.projectName=Tutoria UNAS Frontend
sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=src,e2e
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,e2e/**
sonar.exclusions=**/*.test.ts,**/*.test.tsx,src/test/**,**/node_modules/**,**/dist/**,**/coverage/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/pages/**,src/components/auth/**,src/components/formatos/**,src/components/layout/**,src/components/navigation/**,src/components/panels/**,src/components/ui/**,src/data/**,src/mocks/**,src/styles/**,src/types/**
sonar.cpd.exclusions=src/data/**
