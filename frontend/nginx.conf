# Nginx del contenedor del frontend: solo archivos estáticos.
# El proxy (Caddy) enruta /api y /health al backend y todo lo demás a este contenedor.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok"; }



    # Archivos con hash en el nombre (los genera Vite): caché de un año.
    location ~ "^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css|woff2?|png|svg|webp|jpg)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Recursos sin hash (imágenes y licencias de public/): caché corta.
    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # index.html nunca se cachea: así cada despliegue se ve de inmediato.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri /index.html;
    }
}
